{{- if and .Values.ingress.enabled .Values.ingress.tls.enabled (eq .Values.ingress.tls.mode "certManager") -}}
{{- $hosts := list .Values.host -}}
{{- if .Values.proxy.separateOrigins -}}
{{- $hosts = append $hosts (printf "*.%s" (include "helve.proxyBaseDomain" .)) -}}
{{- end -}}
# The TLS certificate for Helve, issued by cert-manager. One Certificate
# covers every one of Helve's hostnames because they're all served by the
# same Ingress. When proxy.separateOrigins is true, the wildcard entry
# matches exactly one label in front of the base domain — which is why
# _helpers.tpl's guard rejects a proxy.baseDomain more than one label
# deeper than host, matching ProxyOrigin::deployment_for_host in the
# backend (a wildcard cert can't cover more than that one label).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.ingress.tls.secretName }}
  labels:
    {{- include "helve.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.ingress.tls.secretName }}
  commonName: {{ .Values.host }}
  dnsNames:
    {{- range $hosts }}
    - {{ . | quote }}
    {{- end }}
  issuerRef:
    name: {{ .Values.ingress.tls.issuerRef.name }}
    kind: {{ .Values.ingress.tls.issuerRef.kind }}
  privateKey:
    algorithm: ECDSA
    size: 256
    # Renewal gets a fresh key rather than reusing the old one.
    rotationPolicy: Always
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d
{{- end }}
