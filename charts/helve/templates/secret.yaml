{{- if and .Values.adminBootstrap.password (not .Values.adminBootstrap.existingSecret) -}}
# Convenience only. Prefer adminBootstrap.existingSecret (a Secret you
# create out of band) if you'd rather this password never sit in your
# values file/Helm release history at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "helve.adminBootstrapSecretName" . }}
  labels:
    {{- include "helve.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.adminBootstrap.password | quote }}
{{- end }}
