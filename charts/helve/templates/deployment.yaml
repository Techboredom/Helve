{{- $_ := include "helve.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "helve.fullname" . }}
  labels:
    {{- include "helve.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Zero-downtime by default even at replicaCount 1: a new, ready pod comes
  # up (maxSurge) before the old one is torn down (maxUnavailable: 0), so a
  # rollout never drops below full capacity. Session/proxy state lives in
  # Postgres, not in-process, and quota enforcement is a Postgres advisory
  # lock rather than an in-process mutex (AppState::lock_launches) — both
  # required before more than one replica (or an overlapping old+new pod
  # during a rollout) could ever be correct at once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "helve.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "helve.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "helve.serviceAccountName" . }}
      # Kubernetes removes a Terminating pod from Service endpoints
      # asynchronously; the app itself waits out that window before it
      # stops accepting new connections (see shutdown_signal in
      # backend/src/main.rs) rather than using a preStop hook, since the
      # distroless runtime image has no shell to run one. This just needs
      # to be comfortably longer than that in-process wait plus however
      # long a real in-flight request takes to finish.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helve
          image: {{ include "helve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Always watches whichever namespace it's deployed into.
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.deploy.enabled }}
                  name: {{ include "helve.dbSecretName" . }}
                  key: uri
                  {{- else }}
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.existingSecretKey }}
                  {{- end }}
            # The public origin this app is served from. Its scheme is what
            # allows session cookies to be marked Secure, so this must match
            # what users actually type — including https.
            - name: APP_ORIGIN
              value: {{ include "helve.appOrigin" . | quote }}
            {{- if eq .Values.homeDrives.mode "hostPath" }}
            - name: HOME_DRIVES_HOST_BASE_PATH
              value: {{ .Values.homeDrives.hostPath.basePath | quote }}
            {{- else if and (eq .Values.homeDrives.mode "pvc") (eq .Values.homeDrives.pvc.strategy "dynamic") }}
            - name: HOME_DRIVES_STORAGE_CLASS
              value: {{ .Values.homeDrives.pvc.storageClassName | quote }}
            - name: HOME_DRIVES_STORAGE_SIZE
              value: {{ .Values.homeDrives.pvc.size | quote }}
            {{- else if and (eq .Values.homeDrives.mode "pvc") (eq .Values.homeDrives.pvc.strategy "shared") }}
            - name: HOME_DRIVES_SHARED_CLAIM
              value: {{ .Values.homeDrives.pvc.existingClaimName | quote }}
            {{- end }}
            {{- if .Values.proxy.separateOrigins }}
            # Serves each proxied deployment from its own origin,
            # <name>.<baseDomain>, instead of from a path on this app's
            # origin. That separation is what stops a proxied app's
            # JavaScript from calling this app's API as whoever is browsing
            # it. Needs the wildcard DNS record (and, with cert-manager
            # TLS, the matching wildcard certificate).
            - name: PROXY_BASE_DOMAIN
              value: {{ include "helve.proxyBaseDomain" . | quote }}
            {{- end }}
            # Creates the initial `admin` account if the users table is
            # empty, and is ignored once any user exists. `optional: true`
            # means the pod starts fine whether or not the secret is there,
            # so it can be created for the first boot and deleted afterwards
            # without ever editing this chart's values.
            {{- if or .Values.adminBootstrap.existingSecret .Values.adminBootstrap.password }}
            - name: ADMIN_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "helve.adminBootstrapSecretName" .) .Values.adminBootstrap.existingSecret }}
                  key: password
                  optional: true
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # /api/pods used to back both probes, but it requires a session and
          # so answers the kubelet with 401 — which Kubernetes counts as a
          # failure, since only 200-399 pass. Readiness would never have
          # succeeded and liveness would have restarted the container on a
          # loop. Both endpoints below are deliberately unauthenticated.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            # The app bounds its own database check at 2s and answers 503;
            # give it room to say so rather than having the probe time out
            # first, so the reason lands in its logs too.
            timeoutSeconds: 3
          livenessProbe:
            # Deliberately /healthz, not /readyz: this must not depend on
            # Postgres, or a database blip would restart a healthy app.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
