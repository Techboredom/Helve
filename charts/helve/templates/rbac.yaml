{{- if .Values.rbac.create }}
# Everything this app's ServiceAccount can do, scoped to this namespace only —
# no ClusterRole, since the app only ever watches/manages its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "helve.fullname" . }}
  labels:
    {{- include "helve.labels" . | nindent 4 }}
rules:
  # Pods tab: read-only, to watch and display the running pods.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Pod detail panel: container logs, and events explaining why a pod is unhealthy.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Launch tab creates; Pods tab's manage panel reads back, scales/edits
  # resources+env (update), and deletes a deployment the owner launched.
  # `list` backs quota accounting (backend/src/quota.rs), which sums each
  # owner's reserved footprint from Deployment specs — desired state, which
  # is correct the instant it's written — rather than from observed pods,
  # which lag a launch by a second or two and double-count mid-rollout.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "delete"]
  # Launched apps may get their own Service (LoadBalancer or ClusterIP,
  # depending on the template); `get` is also used by the reverse proxy
  # (backend/src/proxy.rs) to look up a proxy-enabled deployment's
  # ClusterIP to connect to; `delete` for the Pods tab's manage panel
  # removing a deployment's Service too. `list` backs the Pods tab's
  # Access column (backend/src/visibility.rs), which reads each
  # deployment's Service to show where it can actually be reached — one
  # list for the namespace rather than a get per pod, which would be an
  # N+1 against the apiserver on every pod-list request.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]
  # Launch/Templates forms' storage-mount fields: `list` backs GET
  # /api/pvcs (any logged-in user, matches the Images catalog's visibility
  # level); `get` confirms a claim named in a launch request actually
  # exists before creating the Deployment, so a typo fails fast with a
  # clear 400 instead of leaving the pod stuck Pending. Read-only by
  # default — Helve never creates or deletes a PersistentVolumeClaim for
  # that shared-mount feature (or for homeDrives with strategy=shared,
  # which reuses this same read-only `get` to confirm
  # homeDrives.pvc.existingClaimName exists); one is always provisioned
  # out-of-band first (see charts/helve/README.md's storage notes).
  # `create` is added only for homeDrives.mode=pvc with strategy=dynamic,
  # which does need it — to provision each user's own home-directory claim
  # on first use (never deleted, same as above).
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list"{{ if and (eq .Values.homeDrives.mode "pvc") (eq .Values.homeDrives.pvc.strategy "dynamic") }}, "create"{{ end }}]
  # The Pods tab's manage panel: "Roll back" finds the ReplicaSet from
  # immediately before the last edit and copies its pod template back onto
  # the Deployment — the same thing `kubectl rollout undo` does, using the
  # revision history Kubernetes already keeps for exactly this. Read-only:
  # Helve never creates/deletes a ReplicaSet directly, only the Deployment
  # that owns them.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  {{- if .Values.istio.enabled }}
  # Istio pod-to-pod tenant isolation (see README.md's Istio section):
  # `serviceaccounts` backs ensure_owner_service_account, one deterministic,
  # unprivileged ServiceAccount per owner reused across every deployment
  # they launch — Helve never deletes one. `authorizationpolicies` backs
  # the matching per-deployment AuthorizationPolicy created alongside every
  # launch and removed alongside every delete; no `update` since Helve
  # never edits one in place, only creates or deletes it whole.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "create", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "helve.fullname" . }}
  labels:
    {{- include "helve.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "helve.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "helve.fullname" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
