apiVersion: v1
kind: Pod
metadata:
  name: {{ include "helve.fullname" . }}-test-connection
  labels:
    {{- include "helve.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  # No cluster credentials of its own needed — this only checks that the
  # app answers HTTP, not that its Kubernetes RBAC is correct.
  restartPolicy: Never
  containers:
    - name: readyz
      image: curlimages/curl:latest
      command:
        - curl
        - --fail
        - --show-error
        - --silent
        - http://{{ include "helve.fullname" . }}:{{ .Values.service.port }}/readyz
