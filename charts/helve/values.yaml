image:
  repository: ghcr.io/techboredom/helve
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent
  # Names of existing image-pull Secrets (e.g. for a private registry).
  pullSecrets: []

# Safe to raise above 1 — session/proxy state lives in Postgres and quota
# enforcement uses a Postgres advisory lock, not in-process state, so
# multiple replicas (or an old+new pod briefly overlapping mid-rollout)
# stay correct. A rolling update never drops below full capacity even at
# the default of 1 (see templates/deployment.yaml's strategy).
replicaCount: 1

# How long a Terminating pod gets before Kubernetes sends SIGKILL. The app
# itself waits ~5s after SIGTERM (giving Service endpoint removal time to
# propagate) before it stops accepting new connections, then drains
# in-flight HTTP requests — this needs to comfortably exceed that plus
# however long a real request takes to finish. Doesn't help an
# already-open long-lived connection (a proxied JupyterLab/RStudio session,
# or the Pods tab's live-update WebSocket) — those still end when the pod
# does, same as any other rolling restart of a stateful WebSocket server.
terminationGracePeriodSeconds: 30

# The one required value — everything else below has a working default.
# The public hostname Helve itself is served from, e.g. "helve.example.com".
host: ""

proxy:
  # Per-deployment proxy origins are served at "<name>.<baseDomain>".
  # Defaults to "proxy.<host>" when empty. Needs a wildcard DNS record (and,
  # with ingress.tls.mode=certManager, a wildcard certificate) for
  # "*.<baseDomain>".
  baseDomain: ""
  # Serves every proxied deployment from its own origin (recommended).
  # Setting this to false serves proxied apps same-origin at
  # /proxy/<name>/ instead, where their JavaScript can call Helve's own
  # API as whoever is browsing them — the chart refuses to render unless
  # allowSameOriginProxy is also set, so that risk can't be taken by
  # accident.
  separateOrigins: true
  allowSameOriginProxy: false

ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    # "certManager" renders a Certificate resource; "existingSecret" uses
    # tls.secretName as-is (a Secret you manage yourself); "none" serves
    # plain HTTP and leaves TLS termination to something in front of this
    # chart entirely.
    mode: certManager
    secretName: helve-tls
    issuerRef:
      name: ""
      kind: ClusterIssuer

database:
  # The supported path: point at a Secret holding a Postgres connection
  # string. Helve runs its own migrations on startup, so nothing further
  # needs creating in the database beyond the database/role themselves.
  existingSecret: ""
  existingSecretKey: uri
  # Evaluation only: deploys a single-replica, no-backups CloudNativePG
  # Postgres alongside Helve. Do not use this for anything you'd be upset
  # to lose — there is no backup/restore story here at all. Requires the
  # CloudNativePG operator already installed on the cluster.
  deploy:
    enabled: false
    storage:
      size: 5Gi
      className: ""

homeDrives:
  # "off" (default), "hostPath", or "pvc". Templates opt in individually
  # via their own home_mount_path field (Templates admin tab) — this only
  # controls where the volume actually comes from.
  mode: "off"
  hostPath:
    # Same path on every node, already holding a shared filesystem (NFS,
    # CephFS, a parallel filesystem, ...) mounted at the OS level — Helve
    # mounts "<this>/<username>" into the container (DirectoryOrCreate),
    # which looks identical from any node without needing a StorageClass
    # or CSI driver at all. Required if mode=hostPath.
    basePath: ""
  pvc:
    # "dynamic" (default): Helve creates one PersistentVolumeClaim per user
    # from storageClassName/size below, on that user's first home-drive
    # launch, and never deletes it - not on relaunch, not on user
    # deletion. Needs storageClassName to support dynamic provisioning.
    #
    # "shared": provision one PersistentVolumeClaim yourself (an RWX share,
    # or a statically-bound PV/PVC pair - same as the existing
    # volume_claim_name storage mount) and name it in existingClaimName.
    # Helve mounts that single claim into every user's pod with
    # subPath: <username> instead, so it never creates or deletes a PVC at
    # all - needs no dynamic provisioning, but has one shared capacity pool
    # rather than a size cap per user.
    strategy: "dynamic"
    # Required if strategy=dynamic. Must support ReadWriteMany if a user
    # can ever run more than one home-drive environment at once - a
    # ReadWriteOnce claim only ever attaches to one node at a time, and
    # Helve doesn't check which kind this is before creating the claim.
    storageClassName: ""
    # Size of each per-user home PVC. Only meaningful with strategy=dynamic.
    size: "10Gi"
    # Required if strategy=shared. The single PVC every user's home
    # directory is a subdirectory of.
    existingClaimName: ""

ldap:
  # LDAP/Active Directory login, tried whenever a login isn't a valid local
  # password — local password login always stays available alongside it.
  enabled: false
  # e.g. "ldaps://dc1.example.com". A plain "ldap://" URL is warned about
  # at startup: the bind password and directory contents then travel
  # unencrypted unless StartTLS is negotiated out of band.
  url: ""
  # DN of the service account Helve binds as to search the directory for a
  # user's DN. Needs no privileges beyond reading it.
  bindDn: ""
  # Secret (key: existingSecretKey) holding bindDn's password.
  existingSecret: ""
  existingSecretKey: bindPassword
  # Base DN to search under, e.g. "ou=people,dc=example,dc=com".
  baseDn: ""
  # e.g. "(uid={username})" (OpenLDAP) or "(sAMAccountName={username})"
  # (Active Directory) — "{username}" is substituted with the submitted username.
  userFilter: ""
  # DN of a group whose membership maps to the admin role, re-checked on
  # every LDAP login (not just the first). Empty means no group mapping —
  # every LDAP-provisioned account is a regular user.
  adminGroupDn: ""
  # Whether a first-time LDAP login with no matching local account creates
  # one automatically. false requires an admin to pre-create the account instead.
  autoProvision: true

oidc:
  # OIDC (SSO) login: an independent, simultaneously-usable alternative to
  # local password and LDAP login, not a replacement for either.
  enabled: false
  issuerUrl: ""
  clientId: ""
  # Secret (key: existingSecretKey) holding the OIDC client secret.
  existingSecret: ""
  existingSecretKey: clientSecret
  # ID token claim to read the Helve username from.
  usernameClaim: preferred_username
  # ID token claim carrying group membership, read as a JSON array of strings.
  groupsClaim: groups
  # A value in groupsClaim that maps to the admin role, re-checked on every
  # login the same way ldap.adminGroupDn is. Empty means no group mapping.
  adminGroup: ""
  # Same meaning as ldap.autoProvision, with one additional wrinkle: see
  # charts/helve/README.md's SSO section for the pre-created-account
  # linking behavior this enables when false.
  autoProvision: true

adminBootstrap:
  # A Secret (key "password") to use instead of adminBootstrap.password.
  existingSecret: ""
  # Convenience for first boot: creates the initial "admin" account with
  # this password if the users table is empty. Ignored once any account
  # exists. See NOTES.txt for retrieving and clearing it after first login.
  password: ""

caBundle:
  # Mounts an existing ConfigMap into the pod and points the backend at a
  # key in it, so its own outbound HTTPS calls (OIDC discovery/token
  # exchange — the only ones it makes today) can validate a certificate
  # signed by a private/internal CA, which isn't in the public root list
  # rustls ships with by default. Empty (default): no extra CA trusted,
  # same as today. A ConfigMap produced by cert-manager's trust-manager
  # project (a "Bundle" resource with useDefaultCAs: true) is a natural
  # fit here — its output is already a complete drop-in CA file, which is
  # exactly the shape this expects.
  configMapName: ""
  configMapKey: ca-certificates.crt

# Empty by default — deliberately. A cluster-specific nodeSelector (e.g.
# a custom node label from the original deployment this chart was ported
# from) baked in here is exactly what would leave a pod Pending with no
# obvious cause on anyone else's cluster.
nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  # Namespace-scoped Role + RoleBinding only — this app only ever watches
  # and manages its own namespace, never a ClusterRole.
  create: true

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Extra environment variables appended to the container, e.g.
# [{name: RUST_LOG, value: debug}].
extraEnv: []
