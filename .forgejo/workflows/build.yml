name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  # GitHub's own runners default to Node 24 for JS-based actions since
  # 2026-06-16 (Node 20 is fully removed there 2026-09-23); this workflow
  # sets the same documented opt-in variable for act_runner's benefit.
  # Unverified here, deliberately: this runner executes host-mode with no
  # per-job container (see the `check`/`build` jobs' own comments below),
  # so whether act_runner honors this the same way GitHub's hosted runner
  # does - or instead needs an actual Node 24 binary reachable on the host,
  # the way Node 20 (nodejs-lts-iron) had to be installed there directly
  # for actions/checkout to run at all - needs checking against a real run
  # on that runner, not something provable from outside it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate: nothing gets built or pushed if the tests or lints fail. The runner
  # executes host-mode and has no Rust toolchain of its own, so this runs in
  # the same image the Dockerfile builds with rather than installing one.
  check:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test and lint
        run: |
          # Named volumes (not paths in the workspace) keep the cargo registry
          # and build artifacts across runs, so this doesn't recompile kube +
          # k8s-openapi from scratch every time. --locked makes a stale
          # Cargo.lock a loud failure instead of a silent rewrite of a file
          # that's bind-mounted from the checkout.
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v helve-ci-cargo:/usr/local/cargo/registry \
            -v helve-ci-target:/src/target \
            rust:1-slim-bookworm \
            bash -eux -c '
              rustup component add clippy
              rustup target add wasm32-unknown-unknown
              cargo test --locked -p backend -p common
              cargo clippy --locked --all-targets -p backend -p common -- -D warnings
              cd frontend && cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
            '

  # amd64 then arm64, sequentially in one job - not two parallel jobs.
  # They used to be parallel (the point being: the fast, native amd64 leg
  # doesn't wait behind the slow, QEMU-emulated arm64 leg), which needed
  # runner.capacity bumped from 1 to 2 to actually run concurrently rather
  # than just queueing. That concurrency is exactly what broke it: `docker
  # buildx create`/`rm`/`--use` mutate shared, non-atomic state under
  # ~/.docker/buildx/, and two of those jobs hitting it at the same
  # wall-clock moment on the same host (same $HOME either way, arch-
  # suffixed $WORKDIR notwithstanding) raced. Three different files came
  # up "missing right after being created" across three separate runs,
  # each in a different specific place - not three unrelated bugs, one
  # shared-state race showing up wherever the timing happened to land
  # that time. Sequential means only one of these two is ever touching
  # that state at once, on this one physical runner, regardless of
  # runner.capacity.
  #
  # Pattern (per-arch builds pushed by digest, merged into one manifest
  # list afterward) mirrors .github/workflows/release.yml's already-proven
  # approach, adapted to plain CLI calls instead of that workflow's
  # docker/*-action steps - those marketplace actions haven't been
  # verified against this specific host-mode runner, and the plain
  # `docker login`/buildx CLI path already has, repeatedly.
  build:
    needs: check
    runs-on: docker
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE: ${{ vars.IMAGE }}
    outputs:
      amd64_digest: ${{ steps.build-amd64.outputs.digest }}
      arm64_digest: ${{ steps.build-arm64.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # Setup and build are one step, not two: an earlier version split
      # them, and the build step relied on setup-buildx.sh's own workdir
      # (holding buildkitd.toml and the CA cert it configures) still being
      # there afterward - unreliable even before the concurrency issue
      # above, for reasons this comment doesn't need to re-litigate now
      # that both are fixed together. One step removes the cross-step
      # assumption entirely: everything setup-buildx.sh writes is
      # guaranteed visible to the rest of this same shell script.
      #
      # Pushed by digest, not a tag: the tag only gets assigned once, to
      # the merged multi-arch manifest list in the merge job below, so an
      # amd64-only image is never briefly visible under a real tag.
      - name: amd64 - set up buildx and build/push by digest
        id: build-amd64
        run: |
          bash .forgejo/scripts/setup-buildx.sh amd64 "${{ github.run_id }}"
          docker buildx build \
            --platform linux/amd64 \
            --metadata-file /tmp/helve-buildx-amd64-${{ github.run_id }}/metadata.json \
            --output "type=image,name=${IMAGE},push=true,push-by-digest=true,name-canonical=true" \
            .
          DIGEST="$(python3 -c "import json; print(json.load(open('/tmp/helve-buildx-amd64-${{ github.run_id }}/metadata.json'))['containerimage.digest'])")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Both the workdir and the builder itself: unlike the old fixed
      # "helve-builder-amd64" name (self-recycled by the next run's own
      # `docker buildx rm` before recreating it), a run-ID-scoped name is
      # never reused by a later run, so nothing else will ever remove it -
      # left alone, every run would leave its own builder container behind
      # forever.
      - name: Clean up amd64 build artifacts
        if: always()
        run: |
          rm -rf /tmp/helve-buildx-amd64-${{ github.run_id }}
          docker buildx rm "helve-builder-amd64-${{ github.run_id }}" 2>/dev/null || true

      # Deliberately after amd64, not parallel to it - see this job's own
      # comment above. Same structure as the amd64 step, arch swapped.
      - name: arm64 - set up buildx and build/push by digest
        id: build-arm64
        run: |
          bash .forgejo/scripts/setup-buildx.sh arm64 "${{ github.run_id }}"
          docker buildx build \
            --platform linux/arm64 \
            --metadata-file /tmp/helve-buildx-arm64-${{ github.run_id }}/metadata.json \
            --output "type=image,name=${IMAGE},push=true,push-by-digest=true,name-canonical=true" \
            .
          DIGEST="$(python3 -c "import json; print(json.load(open('/tmp/helve-buildx-arm64-${{ github.run_id }}/metadata.json'))['containerimage.digest'])")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Same reasoning as the amd64 cleanup step above.
      - name: Clean up arm64 build artifacts
        if: always()
        run: |
          rm -rf /tmp/helve-buildx-arm64-${{ github.run_id }}
          docker buildx rm "helve-builder-arm64-${{ github.run_id }}" 2>/dev/null || true

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

  merge:
    needs: build
    runs-on: docker
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE: ${{ vars.IMAGE }}
      DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # No buildx builder setup here, deliberately - confirmed against
      # Docker's own docs before relying on it: `imagetools create`
      # authenticates via ~/.docker/config.json, the same store the plain
      # `docker login` above already populates, not through a BuildKit
      # builder's own separate registry-trust stack (the thing every other
      # step in this file has to work around). It's a registry-to-registry
      # manifest operation, not a build - there is nothing here for the
      # whole CA saga to apply to.
      - name: Create the multi-arch manifest list
        id: tags
        run: |
          TAG="$(git rev-parse --short HEAD)"
          # BUILD_TAG is Forgejo's own ever-increasing run counter - a
          # readable version number with zero manual effort, distinct from
          # TAG (the commit SHA) so a rebuild of the exact same commit
          # (e.g. workflow_dispatch) still gets a fresh version number
          # rather than being indistinguishable from the original build.
          BUILD_TAG="v${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

          TAG_ARGS=(-t "$IMAGE:$TAG" -t "$IMAGE:$BUILD_TAG" -t "$IMAGE:latest")

          # A deliberate release: pushing a "vX.Y.Z" git tag additionally
          # tags the image with that exact version, alongside (not instead
          # of) the always-present SHA/build-number tags above.
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            TAG_ARGS+=(-t "$IMAGE:$RELEASE_TAG")
          fi

          docker buildx imagetools create "${TAG_ARGS[@]}" \
            "$IMAGE@${{ needs.build.outputs.amd64_digest }}" \
            "$IMAGE@${{ needs.build.outputs.arm64_digest }}"

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

      # Mirrors the public release pipeline's chart push (.github/workflows/
      # release.yml), just against Harbor instead of GHCR, and only on a
      # real "vX.Y.Z" tag — RELEASE_TAG is only set above when this run was
      # triggered by one. A chart per dev commit isn't useful the way the
      # image's SHA/build-number tags are: nothing consumes an
      # arbitrary-version chart, and Argo CD/Helve-Deploy always pin an
      # exact release.
      - name: Set up Helm
        if: env.RELEASE_TAG != ''
        uses: azure/setup-helm@v4

      - name: Package and push chart to Harbor
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p /tmp/chart-out
          helm package charts/helve --version "$RELEASE_TAG" --app-version "$RELEASE_TAG" --destination /tmp/chart-out
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          # Mirrors the GHCR layout (ghcr.io/techboredom/charts/helve) one
          # level down under Harbor's required <registry>/<project>/<repo>
          # shape, so the same "charts/<name>" path means the same thing on
          # both registries.
          helm push "/tmp/chart-out/helve-$RELEASE_TAG.tgz" "oci://$REGISTRY/helve/charts"

      - name: Log out of Helm registry
        if: env.RELEASE_TAG != ''
        run: helm registry logout "$REGISTRY"

      # GitOps deploy: this app's Helm chart lives in this repo
      # (charts/helve/), but the cluster's own values (image tag
      # included) + the Argo CD Application live in the separate
      # Helve-Deploy repo — this job only ever touches the registry and
      # that other repo's git history, never the cluster itself. Argo CD
      # (running in-cluster, watching Helve-Deploy) is what actually
      # rolls the new image out.
      - name: Bump image tag in Helve-Deploy
        run: |
          # Forgejo's PAT convention is token-only in the URL (no
          # username) - "user:token@" pairs get checked as real Basic
          # Auth credentials and fail with "Credentials are incorrect
          # or have expired" unless "user" happens to be the token's
          # actual owner account.
          # The runner executes host-mode (no fresh container per job), so
          # a previous run's clone can still be sitting in /tmp - clear it
          # before cloning fresh.
          rm -rf /tmp/helve-deploy
          git clone "https://${{ secrets.HELVE_DEPLOY_TOKEN }}@$DEPLOY_REPO" /tmp/helve-deploy
          cd /tmp/helve-deploy

          # $TAG names an image in *this* registry, so only rewrite the tag
          # when values.yaml is actually pointing here. When it points
          # somewhere else - as it does while the cluster pulls public
          # release images from GHCR, because the nodes' containerd doesn't
          # trust this registry's CA - a bump would pair that repository
          # with a tag that only exists here and produce an image that
          # cannot be pulled at all. Failing to deploy a new build is a
          # nuisance; silently breaking the running one is not.
          if ! grep -q "^  repository: $REGISTRY" values.yaml; then
            echo "values.yaml does not point at $REGISTRY - leaving image.tag alone."
            echo "Deploy this build by pointing image.repository back here, or"
            echo "let the GitHub release workflow publish a tagged image instead."
            exit 0
          fi

          # values.yaml has exactly one `tag:` key, two spaces deep under
          # `image:` - a plain sed edit rather than pulling in yq for a
          # one-line change to a small, hand-maintained file.
          sed -i -E 's/^  tag:.*/  tag: "'"$TAG"'"/' values.yaml

          if git diff --quiet -- values.yaml; then
            echo "values.yaml unchanged, nothing to deploy"
            exit 0
          fi

          git config user.name "helve-ci"
          git config user.email "helve-ci@users.noreply.git"
          git add values.yaml
          git commit -m "deploy: bump helve image to $TAG"
          git push origin HEAD:main
          cd /
          rm -rf /tmp/helve-deploy

      # Host-mode runner: this machine's disk is shared across every job,
      # not thrown away like a fresh per-job container would be. Clean up
      # what this run produced so it doesn't pile up run after run.
      # if: always() so a failure in an earlier step still leaves the disk
      # clean, rather than needing the next run's steps to clean up first
      # (like the leftover /tmp/helve-deploy this workflow used to hit).
      - name: Clean up build artifacts
        if: always()
        run: |
          rm -rf /tmp/helve-deploy
          docker image prune -f
