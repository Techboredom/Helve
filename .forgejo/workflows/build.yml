name: build-and-push

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  # GitHub's own runners default to Node 24 for JS-based actions since
  # 2026-06-16 (Node 20 is fully removed there 2026-09-23); this workflow
  # sets the same documented opt-in variable for act_runner's benefit.
  # Unverified here, deliberately: this runner executes host-mode with no
  # per-job container (see the `check`/`build` jobs' own comments below),
  # so whether act_runner honors this the same way GitHub's hosted runner
  # does - or instead needs an actual Node 24 binary reachable on the host,
  # the way Node 20 (nodejs-lts-iron) had to be installed there directly
  # for actions/checkout to run at all - needs checking against a real run
  # on that runner, not something provable from outside it.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate: nothing gets built or pushed if the tests or lints fail. The runner
  # executes host-mode and has no Rust toolchain of its own, so this runs in
  # the same image the Dockerfile builds with rather than installing one.
  check:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test and lint
        run: |
          # Named volumes (not paths in the workspace) keep the cargo registry
          # and build artifacts across runs, so this doesn't recompile kube +
          # k8s-openapi from scratch every time. --locked makes a stale
          # Cargo.lock a loud failure instead of a silent rewrite of a file
          # that's bind-mounted from the checkout.
          docker run --rm \
            -v "$PWD:/src" -w /src \
            -v helve-ci-cargo:/usr/local/cargo/registry \
            -v helve-ci-target:/src/target \
            rust:1-slim-bookworm \
            bash -eux -c '
              rustup component add clippy
              rustup target add wasm32-unknown-unknown
              cargo test --locked -p backend -p common
              cargo clippy --locked --all-targets -p backend -p common -- -D warnings
              cd frontend && cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
            '

  build:
    needs: check
    runs-on: docker
    # REGISTRY/IMAGE/DEPLOY_REPO are repository Variables (Settings ->
    # Actions -> Variables, not Secrets - these aren't sensitive on their
    # own, just specific to wherever this is actually deployed), so this
    # workflow file itself names no real infrastructure - it's the same
    # file whether it's public or not.
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE: ${{ vars.IMAGE }}
      DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We only need this repo's source to build the image - nothing
          # later needs to run authenticated git commands against it. Left
          # at the default (true), checkout persists its own auto-injected
          # credential (scoped only to this repo) into the job's git config,
          # which then collides with the explicit HELVE_DEPLOY_TOKEN the
          # "Bump image tag" step uses to clone the separate Helve-Deploy
          # repo on the same git host.
          persist-credentials: false

      - name: Log in to registry
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # This runner is a single amd64 host, unlike the public release
      # pipeline's two native GitHub-hosted runners (one per arch) — so
      # arm64 here is QEMU-emulated, not native. That makes the build
      # noticeably slower (emulated Rust compilation is tens of minutes),
      # but this pipeline isn't on any release-turnaround deadline the way
      # a tagged public release is, so the simplicity of one runner
      # producing both platforms outweighs the speed cost. Idempotent and
      # left in place afterward (not torn down in cleanup) — same
      # persist-across-runs reasoning as the `check` job's named cargo
      # volumes: a host-mode runner's state survives between runs, so
      # there's no reason to pay this setup cost every single time.
      - name: Set up QEMU + buildx (multi-arch)
        run: |
          docker run --rm --privileged tonistiigi/binfmt --install all

          # Four attempts before this one tried to make the docker-container
          # driver's BuildKit trust Harbor by patching its OS-level cert
          # store (append to /etc/ssl/certs/ca-certificates.crt, restart,
          # repeat). Every one of those still failed pushing blobs with the
          # exact same "x509: certificate signed by unknown authority" -
          # because that was never the trust store BuildKit's registry
          # client actually reads. Confirmed against real BuildKit/buildx
          # issues hitting this identical symptom (moby/buildkit#5576,
          # docker/buildx#1508) and Docker's own current docs: registry TLS
          # trust needs an explicit buildkitd.toml
          # `[registry."host"] ca=[...]` entry, applied when the builder
          # container is *created* - there's no way to hot-patch it into an
          # already-running one, which is why restarting the old container
          # never helped no matter what was in its cert bundle.
          #
          # Where the host trusts this CA from is still not assumed to be
          # one fixed path - this project has now hit CA trust living in a
          # different place on every surface it's touched (k8s node
          # containerd, the Docker daemon, and this host's own Arch
          # trust-anchors rather than certs.d). Same search-by-subject
          # approach as before.
          CA_SRC=""
          for candidate in \
            /etc/docker/certs.d/ctr.int.techboredom.com:8443/ca.crt \
            /etc/ssl/certs/*.pem \
            /etc/pki/ca-trust/source/anchors/*.crt \
            /usr/local/share/ca-certificates/*.crt
          do
            [ -f "$candidate" ] || continue
            if openssl x509 -in "$candidate" -noout -subject 2>/dev/null | grep -q 'O=LocalCA'; then
              CA_SRC="$candidate"
              break
            fi
          done

          if [ -z "$CA_SRC" ]; then
            echo "Could not find the internal CA (subject O=LocalCA) anywhere this runner checked."
            echo "docker login succeeding means the host trusts it from *somewhere* - add that"
            echo "location to the candidate list above."
            exit 1
          fi

          # Baked into a custom image rather than docker cp'd into a running
          # container: the cert has to exist before buildkitd's own process
          # starts and parses its config (it loads CA files into an in-memory
          # pool once, not per-request), so it needs to be present from the
          # container's very first boot - not added after the fact, which is
          # exactly the ordering the previous attempts got wrong. -L
          # dereferences: this host's copy is a symlink (Arch's trust-anchor
          # extraction), and `docker build`'s COPY needs the real bytes, not
          # a link to a host path that won't exist inside the build context.
          rm -rf /tmp/helve-buildkit-ca && mkdir -p /tmp/helve-buildkit-ca
          cp -L "$CA_SRC" /tmp/helve-buildkit-ca/internal-ca.pem
          cat > /tmp/helve-buildkit-ca/Dockerfile <<'DOCKERFILE'
          FROM moby/buildkit:buildx-stable-1
          COPY internal-ca.pem /usr/local/share/ca-certificates/internal-ca.crt
          DOCKERFILE
          docker build -t helve-buildkit-with-ca /tmp/helve-buildkit-ca

          # The directive BuildKit's registry client actually consults -
          # this is the piece all four earlier attempts were missing
          # entirely. Path is inside the image built above, not this host.
          cat > /tmp/helve-buildkitd.toml <<TOML
          [registry."ctr.int.techboredom.com:8443"]
            ca = ["/usr/local/share/ca-certificates/internal-ca.crt"]
          TOML

          # Both buildkitd-config and a custom image only take effect at
          # container creation, so the builder is fully recreated every run
          # rather than reused - the previous "leave it running between
          # runs" optimization doesn't survive needing either of these.
          # Rebuilding a 2-line Dockerfile FROM an already-pulled base is a
          # few seconds, nowhere near the QEMU/binfmt bootstrap cost that
          # optimization actually existed to avoid, so simple and correct
          # wins over clever-but-untested here.
          docker buildx rm helve-builder 2>/dev/null || true
          docker buildx create --name helve-builder --driver docker-container \
            --driver-opt image=helve-buildkit-with-ca \
            --buildkitd-config /tmp/helve-buildkitd.toml \
            --use
          docker buildx inspect --bootstrap

      - name: Build and push multi-arch image
        run: |
          TAG="$(git rev-parse --short HEAD)"
          # BUILD_TAG is Forgejo's own ever-increasing run counter - a
          # readable version number with zero manual effort, distinct from
          # TAG (the commit SHA) so a rebuild of the exact same commit
          # (e.g. workflow_dispatch) still gets a fresh version number
          # rather than being indistinguishable from the original build.
          BUILD_TAG="v${{ github.run_number }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

          TAG_ARGS=(-t "$IMAGE:$TAG" -t "$IMAGE:$BUILD_TAG" -t "$IMAGE:latest")

          # A deliberate release: pushing a "vX.Y.Z" git tag additionally
          # tags the image with that exact version, alongside (not instead
          # of) the always-present SHA/build-number tags above.
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            RELEASE_TAG="${REF#refs/tags/}"
            echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            TAG_ARGS+=(-t "$IMAGE:$RELEASE_TAG")
          fi

          # buildx pushes the manifest list directly as part of the build -
          # there's no separate "docker push" step the way a single-arch
          # `docker build` + `docker push` pair needs.
          docker buildx build --platform linux/amd64,linux/arm64 "${TAG_ARGS[@]}" --push .

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY"

      # Mirrors the public release pipeline's chart push (.github/workflows/
      # release.yml), just against Harbor instead of GHCR, and only on a
      # real "vX.Y.Z" tag — RELEASE_TAG is only set above when this run was
      # triggered by one. A chart per dev commit isn't useful the way the
      # image's SHA/build-number tags are: nothing consumes an
      # arbitrary-version chart, and Argo CD/Helve-Deploy always pin an
      # exact release.
      - name: Set up Helm
        if: env.RELEASE_TAG != ''
        uses: azure/setup-helm@v4

      - name: Package and push chart to Harbor
        if: env.RELEASE_TAG != ''
        run: |
          mkdir -p /tmp/chart-out
          helm package charts/helve --version "$RELEASE_TAG" --app-version "$RELEASE_TAG" --destination /tmp/chart-out
          echo "${{ secrets.REGISTRY_PASSWORD }}" | helm registry login "$REGISTRY" -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          # Mirrors the GHCR layout (ghcr.io/techboredom/charts/helve) one
          # level down under Harbor's required <registry>/<project>/<repo>
          # shape, so the same "charts/<name>" path means the same thing on
          # both registries.
          helm push "/tmp/chart-out/helve-$RELEASE_TAG.tgz" "oci://$REGISTRY/helve/charts"

      - name: Log out of Helm registry
        if: env.RELEASE_TAG != ''
        run: helm registry logout "$REGISTRY"

      # GitOps deploy: this app's Helm chart lives in this repo
      # (charts/helve/), but the cluster's own values (image tag
      # included) + the Argo CD Application live in the separate
      # Helve-Deploy repo — this job only ever touches the registry and
      # that other repo's git history, never the cluster itself. Argo CD
      # (running in-cluster, watching Helve-Deploy) is what actually
      # rolls the new image out.
      - name: Bump image tag in Helve-Deploy
        run: |
          # Forgejo's PAT convention is token-only in the URL (no
          # username) - "user:token@" pairs get checked as real Basic
          # Auth credentials and fail with "Credentials are incorrect
          # or have expired" unless "user" happens to be the token's
          # actual owner account.
          # The runner executes host-mode (no fresh container per job), so
          # a previous run's clone can still be sitting in /tmp - clear it
          # before cloning fresh.
          rm -rf /tmp/helve-deploy
          git clone "https://${{ secrets.HELVE_DEPLOY_TOKEN }}@$DEPLOY_REPO" /tmp/helve-deploy
          cd /tmp/helve-deploy

          # $TAG names an image in *this* registry, so only rewrite the tag
          # when values.yaml is actually pointing here. When it points
          # somewhere else - as it does while the cluster pulls public
          # release images from GHCR, because the nodes' containerd doesn't
          # trust this registry's CA - a bump would pair that repository
          # with a tag that only exists here and produce an image that
          # cannot be pulled at all. Failing to deploy a new build is a
          # nuisance; silently breaking the running one is not.
          if ! grep -q "^  repository: $REGISTRY" values.yaml; then
            echo "values.yaml does not point at $REGISTRY - leaving image.tag alone."
            echo "Deploy this build by pointing image.repository back here, or"
            echo "let the GitHub release workflow publish a tagged image instead."
            exit 0
          fi

          # values.yaml has exactly one `tag:` key, two spaces deep under
          # `image:` - a plain sed edit rather than pulling in yq for a
          # one-line change to a small, hand-maintained file.
          sed -i -E 's/^  tag:.*/  tag: "'"$TAG"'"/' values.yaml

          if git diff --quiet -- values.yaml; then
            echo "values.yaml unchanged, nothing to deploy"
            exit 0
          fi

          git config user.name "helve-ci"
          git config user.email "helve-ci@users.noreply.git"
          git add values.yaml
          git commit -m "deploy: bump helve image to $TAG"
          git push origin HEAD:main
          cd /
          rm -rf /tmp/helve-deploy

      # Host-mode runner: this machine's disk is shared across every job,
      # not thrown away like a fresh per-job container would be. Clean up
      # what this run produced so it doesn't pile up run after run.
      # if: always() so a failure in an earlier step still leaves the disk
      # clean, rather than needing the next run's steps to clean up first
      # (like the leftover /tmp/helve-deploy this workflow used to hit).
      - name: Clean up build artifacts
        if: always()
        run: |
          rm -rf /tmp/helve-deploy
          # The docker-container buildx driver pushes straight to the
          # registry without loading multi-arch results into the local
          # `docker images` store, so this is mostly a no-op now - kept as
          # a harmless safety net in case that ever changes.
          docker image rm -f "$IMAGE:$TAG" "$IMAGE:$BUILD_TAG" "$IMAGE:latest" ${RELEASE_TAG:+"$IMAGE:$RELEASE_TAG"} 2>/dev/null || true
          docker image prune -f
