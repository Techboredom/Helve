[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
bytes = "1"
axum-extra = { version = "0.12.6", features = ["cookie"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
common = { version = "0.1.0", path = "../common" }
futures = "0.3.34"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client", "rustls-tls"] }
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
openidconnect = "4.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "json"] }
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
