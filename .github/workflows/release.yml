name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase, not `${{ github.repository_owner }}`: Docker/OCI
  # repository names must be all-lowercase, but a GitHub org's display name
  # isn't (this org is "Techboredom") - ghcr.io rejects the mixed-case
  # form outright. GitHub Actions has no built-in toLower() expression, and
  # this project only ever runs under this one owner, so hardcoding it is
  # simpler than a shell step to lowercase it on every job that needs it.
  IMAGE_NAME: techboredom/helve
  # See ci.yml's identical setting for why this is explicit rather than
  # relying on the runner's current default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners, not QEMU emulation: emulated Rust compilation is
          # slow enough (tens of minutes) to make releases painful. Both are
          # GitHub-hosted, free for public repos.
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Pushed by digest, not by tag: the tag only gets assigned once to the
      # merged multi-arch manifest list in the "merge" job below, so an
      # amd64-only or arm64-only image is never briefly visible under the
      # release tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge into a multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.version }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"

  chart:
    name: Package and push the Helm chart
    needs: merge
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          VERSION="${{ needs.merge.outputs.version }}"
          mkdir -p /tmp/chart-out
          helm package charts/helve --version "$VERSION" --app-version "$VERSION" --destination /tmp/chart-out
          # Same lowercase-hardcoding reasoning as IMAGE_NAME above.
          helm push "/tmp/chart-out/helve-$VERSION.tgz" "oci://${{ env.REGISTRY }}/techboredom/charts"

  release:
    name: Create GitHub Release
    needs: [merge, chart]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract this version's CHANGELOG section
        run: |
          VERSION="${{ needs.merge.outputs.version }}"
          # Literal (not regex) matching: version numbers contain ".",
          # which is a character-class metacharacter inside "[...]" in ERE.
          awk -v marker="## [$VERSION]" '
            index($0, marker) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          generate_release_notes: true
